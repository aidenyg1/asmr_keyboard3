<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalized Keyboard ASMR</title>
    <style>
        :root {
            --bg: #050505;
            --kb-frame: #0d0d0d;
            --key: #181818;
            --key-active: #ffffff;
            --accent: #c084fc; /* Soft Purple for ASMR vibe */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { 
            font-weight: 200; 
            letter-spacing: 12px; 
            font-size: 0.9rem; 
            color: #555; 
            margin-bottom: 15px; 
            text-transform: uppercase;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 20px;
            background: rgba(192, 132, 252, 0.1);
            border: 1px solid rgba(192, 132, 252, 0.3);
            border-radius: 20px;
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .kb-case {
            background: var(--kb-frame);
            padding: 40px;
            border-radius: 40px;
            box-shadow: 0 100px 200px rgba(0,0,0,1);
            border: 1px solid #1a1a1a;
            position: relative;
        }

        .kb-case::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(145deg, #222, #000);
            z-index: -1;
            border-radius: 42px;
        }

        .row { display: flex; gap: 10px; justify-content: center; margin-bottom: 10px; }

        .key {
            background: var(--key);
            color: #444;
            height: 65px;
            min-width: 65px;
            padding: 0 15px;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 500;
            font-size: 13px;
            transition: all 0.05s cubic-bezier(0.2, 0, 0, 1);
            border: 1px solid #000;
            box-shadow: 0 8px 0 #000;
        }

        .key.active {
            transform: translateY(6px);
            box-shadow: 0 1px 0 #000;
            background: #222;
            color: #eee;
            border-color: var(--accent);
        }

        /* Special Keys */
        .key.backspace { min-width: 130px; }
        .key.tab { min-width: 100px; }
        .key.caps { min-width: 120px; }
        .key.enter { min-width: 145px; }
        .key.shift { min-width: 190px; }
        .key.space { min-width: 500px; }

        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 2px solid rgba(192, 132, 252, 0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .footer {
            position: fixed;
            bottom: 30px;
            color: #222;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>

    <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
        <p style="color: #666; font-size: 0.8rem; letter-spacing: 2px;">LOADING LOCAL SOUND BANK...</p>
    </div>

    <div class="header">
        <h1>PERSONAL ASMR STATION</h1>
        <div class="status-badge" id="status-text">ANALYZING AUDIO FILE...</div>
    </div>

    <div class="kb-case">
        <div class="kb-frame">
            <div class="row">
                <div class="key" data-key="Backquote">`</div>
                <div class="key" data-key="Digit1">1</div><div class="key" data-key="Digit2">2</div><div class="key" data-key="Digit3">3</div><div class="key" data-key="Digit4">4</div><div class="key" data-key="Digit5">5</div><div class="key" data-key="Digit6">6</div><div class="key" data-key="Digit7">7</div><div class="key" data-key="Digit8">8</div><div class="key" data-key="Digit9">9</div><div class="key" data-key="Digit0">0</div>
                <div class="key" data-key="Minus">-</div><div class="key" data-key="Equal">=</div>
                <div class="key backspace" data-key="Backspace">DELETE</div>
            </div>
            <div class="row">
                <div class="key tab" data-key="Tab">TAB</div>
                <div class="key" data-key="KeyQ">Q</div><div class="key" data-key="KeyW">W</div><div class="key" data-key="KeyE">E</div><div class="key" data-key="KeyR">R</div><div class="key" data-key="KeyT">T</div><div class="key" data-key="KeyY">Y</div><div class="key" data-key="KeyU">U</div><div class="key" data-key="KeyI">I</div><div class="key" data-key="KeyO">O</div><div class="key" data-key="KeyP">P</div>
                <div class="key" data-key="BracketLeft">[</div><div class="key" data-key="BracketRight">]</div><div class="key" data-key="Backslash">\</div>
            </div>
            <div class="row">
                <div class="key caps" data-key="CapsLock">CAPS</div>
                <div class="key" data-key="KeyA">A</div><div class="key" data-key="KeyS">S</div><div class="key" data-key="KeyD">D</div><div class="key" data-key="KeyF">F</div><div class="key" data-key="KeyG">G</div><div class="key" data-key="KeyH">H</div><div class="key" data-key="KeyJ">J</div><div class="key" data-key="KeyK">K</div><div class="key" data-key="KeyL">L</div>
                <div class="key" data-key="Semicolon">;</div><div class="key" data-key="Quote">'</div>
                <div class="key enter" data-key="Enter">RETURN</div>
            </div>
            <div class="row">
                <div class="key shift" data-key="ShiftLeft">SHIFT</div>
                <div class="key" data-key="KeyZ">Z</div><div class="key" data-key="KeyX">X</div><div class="key" data-key="KeyC">C</div><div class="key" data-key="KeyV">V</div><div class="key" data-key="KeyB">B</div><div class="key" data-key="KeyN">N</div><div class="key" data-key="KeyM">M</div>
                <div class="key" data-key="Comma">,</div><div class="key" data-key="Period">.</div><div class="key" data-key="Slash">/</div>
                <div class="key shift" data-key="ShiftRight">SHIFT</div>
            </div>
            <div class="row">
                <div class="key" style="min-width: 90px;">CTRL</div>
                <div class="key" style="min-width: 90px;">OPT</div>
                <div class="key" style="min-width: 90px;">CMD</div>
                <div class="key space" data-key="Space"></div>
                <div class="key" style="min-width: 90px;">CMD</div>
                <div class="key" style="min-width: 90px;">OPT</div>
                <div class="key" style="min-width: 90px;">CTRL</div>
            </div>
        </div>
    </div>

    <div class="footer">BEST WITH OPEN-BACK HEADPHONES.</div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let soundBuffer = null;
        // [수정] 새로 업로드하신 MP4 영상 파일 이름을 적용했습니다.
        const localFilePath = '[ASMR] 💙🦋시나모롤과 함께 키보드asmr(10분)_1.mp4';

        // 1. 오디오 로드 및 슬라이싱 엔진
        async function loadSoundBank() {
            const statusText = document.getElementById('status-text');
            const loadingOverlay = document.getElementById('loading');
            
            try {
                const response = await fetch(localFilePath);
                if (!response.ok) throw new Error('File not found');
                
                const arrayBuffer = await response.arrayBuffer();
                // MP4 파일에서도 오디오 트랙을 자동으로 추출하여 디코딩합니다.
                soundBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                
                statusText.innerText = 'VIDEO AUDIO READY';
                setTimeout(() => {
                    loadingOverlay.style.opacity = '0';
                    setTimeout(() => loadingOverlay.style.display = 'none', 1000);
                }, 500);
            } catch (err) {
                console.warn('Local file load failed. Falling back to high-end synthesis.');
                statusText.innerText = 'SYNTHESIS ENGINE ACTIVE';
                loadingOverlay.style.display = 'none';
            }
        }

        // 2. 스마트 타건음 재생 (영상 속 고정된 하나의 소리 사용)
        function playSmartSound(code) {
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (soundBuffer) {
                const source = audioCtx.createBufferSource();
                source.buffer = soundBuffer;
                
                const masterGain = audioCtx.createGain();
                masterGain.gain.value = 5.0; // 영상 소리에 맞춰 볼륨 조정

                const compressor = audioCtx.createDynamicsCompressor();
                compressor.threshold.setValueAtTime(-24, audioCtx.currentTime);
                compressor.knee.setValueAtTime(30, audioCtx.currentTime);
                compressor.ratio.setValueAtTime(12, audioCtx.currentTime);
                compressor.attack.setValueAtTime(0.003, audioCtx.currentTime);
                compressor.release.setValueAtTime(0.25, audioCtx.currentTime);
                
                // [수정] 영상의 특정 지점(초)을 설정하세요. 
                // 예: 12.5초 지점의 소리를 쓰려면 12.5로 변경
                const fixedOffset = 15.0; 
                
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 7000; 
                
                let pitch = 1.0 + (Math.random() * 0.02 - 0.01);
                let volMult = 1.0;

                if (code === 'Space') {
                    pitch *= 0.88;
                    volMult = 1.2;
                }

                const individualGain = audioCtx.createGain();
                individualGain.gain.value = volMult;

                source.playbackRate.value = pitch;
                
                source.connect(filter);
                filter.connect(compressor);
                compressor.connect(individualGain);
                individualGain.connect(masterGain);
                masterGain.connect(audioCtx.destination);
                
                const playDuration = 0.4; 
                source.start(0, fixedOffset, playDuration);
                
                individualGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + playDuration);
            } else {
                // 백업용 합성음 (이전 버전의 Thock 소리)
                playBackupSynth(code);
            }
        }

        function playBackupSynth(code) {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = 'sine';
            let f = code === 'Space' ? 70 : 100;
            osc.frequency.setValueAtTime(f, now);
            osc.frequency.exponentialRampToValueAtTime(f/2, now + 0.1);
            g.gain.setValueAtTime(0.4, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.connect(g).connect(audioCtx.destination);
            osc.start(); osc.stop(now + 0.1);
        }

        // 4. 입력 핸들러
        window.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            const key = document.querySelector(`.key[data-key="${e.code}"]`);
            if (key) {
                key.classList.add('active');
                playSmartSound(e.code);
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = document.querySelector(`.key[data-key="${e.code}"]`);
            if (key) key.classList.remove('active');
        });

        document.querySelectorAll('.key').forEach(k => {
            k.addEventListener('mousedown', () => {
                k.classList.add('active');
                playSmartSound(k.dataset.key);
            });
            k.addEventListener('mouseup', () => k.classList.remove('active'));
        });

        // 초기화
        loadSoundBank();
        document.body.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }, { once: true });
    </script>
</body>
</html>
